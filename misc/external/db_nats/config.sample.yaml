# Reference configuration for the db_nats backend.
#
# Nothing is permitted by default: a table with no grant, an operation not
# listed, or a column outside the allowlist is refused before any SQL is built.

nats:
  url: "nats://127.0.0.1:4222"
  queue_group: "kamailio-db"
  # Must match the path in Kamailio's db_url, e.g.
  #   modparam("usrloc", "db_url", "nats://127.0.0.1:4222/kamailio.db")
  subject_prefix: "kamailio.db"
  # creds_file: "/etc/kamailio/db_nats.creds"

  # Raw SQL passthrough. Required by sqlops (it gates on DB_CAP_RAW_QUERY at
  # startup) and by usrloc's ul.db_* RPC commands. Leave false unless needed:
  # opaque SQL cannot be checked against the grants below.
  #
  # Better still, deny the "<prefix>.raw" subject in the publishing account's
  # NATS permissions, so the bus enforces it rather than this process.
  enable_raw: false

mysql:
  dsn: "kamailio:kamailiorw@tcp(127.0.0.1:3306)/kamailio"
  max_open_conns: 16
  max_idle_conns: 8
  # Used to convert between MySQL DATETIME and the epoch seconds on the wire.
  # "Local" matches db_mysql, which resolves datetimes with mktime().
  timezone: "Local"
  # Report UNSIGNED columns as DB1_UINT/DB1_UBIGINT instead of DB1_INT/DB1_BIGINT.
  # Off by default, matching db_mysql's unsigned_type modparam.
  unsigned_type: false

cursors:
  # usrloc preloads whole tables, so fetch_result pages through a cursor.
  # There is no guaranteed close in the srdb1 API, hence the TTL.
  idle_ttl: 60s
  max: 64
  max_rows_per_page: 10000

shutdown:
  # On SIGTERM the backend stops taking new work, but keeps serving cursors
  # that are already open until they finish or this expires. Without it a
  # restart pulls the result set out from under a client mid-preload.
  grace: 30s

grants:
  # Required by every module that calls db_check_table_version().
  - table: version
    ops: [select]
    columns: [table_name, table_version]

  - table: subscriber
    ops: [select]
    columns: [username, domain, ha1, ha1b, rpid]

  - table: location
    ops: [select, insert, update, delete]
    columns: ["*"]

  - table: location_attrs
    ops: [select, insert, delete]
    columns: ["*"]

  # Example of a narrower grant: refuse an unscoped read of the whole table.
  # - table: acc
  #   ops: [select]
  #   columns: ["*"]
  #   require_filter: [callid]
  #   max_rows: 1000
